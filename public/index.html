<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>대상지 반경 토지용도·시설 분석 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>대상지 반경 토지용도 · 시설 분석 대시보드</h1>
    <div class="topbar-actions">
      <button id="themeToggle" class="icon-btn" title="다크모드 전환" type="button">🌓</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>1. 대상지 선택</h2>
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="주소 또는 장소명 검색 (예: 서울특별시청)" />
          <button id="searchBtn" type="button">검색</button>
        </div>
        <ul id="searchResults" class="search-results"></ul>
        <p class="hint">또는 지도를 클릭해 대상지 지점을 바로 지정할 수 있습니다.</p>
        <p id="targetCoord" class="coord-readout">선택된 좌표: 없음</p>
      </section>

      <section class="panel">
        <h2>2. 분석 반경</h2>
        <div class="radius-row">
          <input id="radiusRange" type="range" min="500" max="1000" step="50" value="750" />
          <span id="radiusValue">750 m</span>
        </div>
        <button id="analyzeBtn" type="button" class="primary-btn" disabled>이 지점 기준 분석하기</button>
        <p id="statusMsg" class="status-msg"></p>
      </section>

      <section class="panel">
        <h2>3. 요약</h2>
        <div id="summaryStats" class="summary-grid">
          <div class="stat-tile"><span class="stat-value" id="statFacilityCount">–</span><span class="stat-label">주변 시설 수 (OSM)</span></div>
          <div class="stat-tile"><span class="stat-value" id="statLanduseCount">–</span><span class="stat-label">토지이용 구역 수 (OSM)</span></div>
        </div>
      </section>

      <section class="panel">
        <h2>4. 시설 분포</h2>
        <div class="chart-wrap"><canvas id="facilityChart" height="220"></canvas></div>
        <div id="facilityLegend" class="legend"></div>
      </section>

      <section class="panel">
        <h2>5. 토지이용 구성 (OSM landuse)</h2>
        <div class="chart-wrap"><canvas id="landuseChart" height="220"></canvas></div>
        <div id="landuseLegend" class="legend"></div>
        <p id="landuseNote" class="hint"></p>
      </section>

      <section class="panel">
        <h2>6. 상세 목록</h2>
        <div class="tabs">
          <button class="tab-btn active" data-tab="facility" type="button">시설 목록</button>
          <button class="tab-btn" data-tab="landuse" type="button">토지이용 목록</button>
        </div>
        <div class="table-wrap">
          <table id="facilityTable" class="data-table">
            <thead><tr><th>이름</th><th>분류</th><th>거리(m)</th></tr></thead>
            <tbody></tbody>
          </table>
          <table id="landuseTable" class="data-table hidden">
            <thead><tr><th>구분</th><th>필지/구역 수</th><th>면적(㎡)</th><th>비율(%)</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <button id="exportBtn" type="button" class="secondary-btn" disabled>GeoJSON으로 내보내기</button>
      </section>
    </aside>

    <section id="map" class="map"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
